plugins { id 'com.android.application' }

android {
    namespace 'io.github.oju12.hankki'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.oju12.hankki'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        def origin = providers.gradleProperty('hankkiOrigin').getOrElse('')
        if (origin && !(origin ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?/)) {
            throw new GradleException("hankkiOrigin must be an HTTPS origin")
        }
        buildConfigField 'String', 'DEFAULT_ORIGIN', '"' + origin + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (System.getenv('HANKKI_KEYSTORE')) {
            upload {
                storeFile file(System.getenv('HANKKI_KEYSTORE'))
                storePassword System.getenv('HANKKI_STORE_PASSWORD')
                keyAlias System.getenv('HANKKI_KEY_ALIAS')
                keyPassword System.getenv('HANKKI_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { if (signingConfigs.findByName('upload')) signingConfig signingConfigs.upload }
    }
}

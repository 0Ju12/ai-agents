<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#173e32" />
    <title>한끼 · 냉장고 생활 코치</title>
    <link rel="icon" href="/static/mark.svg" />
    <link rel="stylesheet" href="/static/app.css" />
    <script defer src="/static/app.js"></script>
    <script defer src="/static/interactions.js"></script>
    <script defer src="/static/scene.js"></script>
    <script defer src="/static/cook.js"></script>
    <script defer src="/static/agent.js"></script>
    <script defer src="/static/figure.js"></script>
    <script defer src="/static/workout.js"></script>
    <script defer src="/static/reminders.js"></script>
    <script defer src="/static/health.js"></script>
    <script defer src="/static/onboarding.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">본문으로</a>
    <aside id="side">
      <a class="brand" href="#today"><img src="/static/mark.svg" alt="" />한끼<span>hankki</span></a>
      <nav id="side-nav" aria-label="주 메뉴"></nav>
      <div class="side-foot"><a href="/privacy">개인정보 안내</a></div>
    </aside>
    <div class="shell">
      <header class="top">
        <a class="brand mobile-brand" href="#today"><img src="/static/mark.svg" alt="" />한끼</a
        ><span id="crumb">나의 대시보드</span>
        <div class="top-actions">
          <span id="date"></span
          ><button class="iconbtn" data-do="tour" aria-label="사용법 보기">
            <svg class="ic"><use href="/static/icons.svg#i-circle-help" /></svg></button
          ><button class="iconbtn" data-do="settings" aria-label="나의 식단 및 운동 설정">
            <svg class="ic"><use href="/static/icons.svg#i-sliders-horizontal" /></svg>
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1"><p role="status">냉장고를 열고 있어요…</p></main>
    </div>
    <nav id="mobile-nav" aria-label="하단 메뉴"></nav>
    <dialog id="sheet" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="iconbtn" data-do="close" aria-label="닫기">×</button>
      </div>
      <div id="sheet-body"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>재료를 입력하고 추천을 받으려면 JavaScript를 켜 주세요.</noscript>
  </body>
</html>
